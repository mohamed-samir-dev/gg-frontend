<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Circular text paths -->
    <path id="textCircleTop" d="M 40,150 A 110,110 0 0,1 260,150" fill="none" />
    <path id="textCircleBottom" d="M 260,150 A 110,110 0 0,1 40,150" fill="none" />
  </defs>

  <!-- Outer dashed & solid circles -->
  <circle cx="150" cy="150" r="142" fill="none" stroke="#047857" stroke-width="4" stroke-dasharray="8,4" />
  <circle cx="150" cy="150" r="134" fill="none" stroke="#065f46" stroke-width="3" />
  <circle cx="150" cy="150" r="102" fill="none" stroke="#065f46" stroke-width="2" />

  <!-- Arabic curved text on top -->
  <text fill="#065f46" font-family="'Cairo', Arial, sans-serif" font-size="14.5" font-weight="900" letter-spacing="1">
    <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
      شركة جرين لاين للأسمدة والمخصبات الزراعية
    </textPath>
  </text>

  <!-- English & approval text on bottom -->
  <text fill="#047857" font-family="Arial, sans-serif" font-size="12" font-weight="bold" letter-spacing="2">
    <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
      ★ GREEN LINE FERTILIZERS • CERTIFIED ★
    </textPath>
  </text>

  <!-- Inner Center Shield & Plant Sprout Icon -->
  <g transform="translate(150, 140)">
    <!-- Sprout stem and leaves -->
    <path d="M 0,22 C -2,5 -18,-15 -28,-18 C -30,5 -15,24 0,22 Z" fill="#047857" opacity="0.9" />
    <path d="M 0,22 C 2,5 18,-15 28,-18 C 30,5 15,24 0,22 Z" fill="#059669" opacity="0.9" />
    <path d="M 0,28 L 0,8 C 0,-15 0,-25 0,-25" fill="none" stroke="#064e3b" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="-28" r="4.5" fill="#10b981" />
  </g>

  <!-- Approval Ribbon Banner Text -->
  <rect x="70" y="178" width="160" height="26" rx="6" fill="#065f46" />
  <text x="150" y="196" fill="#ffffff" font-family="'Cairo', Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">
    معتمد ومطابق للمواصفات
  </text>

  <!-- Registration Number -->
  <text x="150" y="222" fill="#065f46" font-family="'Cairo', Arial, sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    س.ت / ترخيص زراعي: 1010569266
  </text>
</svg>
