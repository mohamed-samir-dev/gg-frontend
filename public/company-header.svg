<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="60%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>

  <!-- Background bar -->
  <rect x="0" y="0" width="900" height="114" rx="14" fill="url(#headerGrad)" />
  <rect x="0" y="112" width="900" height="4" rx="2" fill="url(#goldAccent)" />

  <!-- Left: English name & Contact -->
  <g transform="translate(30, 28)">
    <text x="0" y="24" fill="#ffffff" font-family="'Cairo', Arial, sans-serif" font-size="20" font-weight="900" letter-spacing="1">GREEN LINE FERTILIZERS</text>
    <text x="0" y="44" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="12" font-weight="600">Agricultural Nutrients &amp; Soil Enhancers</text>
    <text x="0" y="64" fill="#ecfdf5" font-family="Arial, sans-serif" font-size="11">Tel: +20 155 245 6445</text>
  </g>

  <!-- Center Decorative Leaf Pattern -->
  <g transform="translate(450, 42)">
    <circle cx="0" cy="12" r="28" fill="#047857" stroke="#34d399" stroke-width="2" />
    <path d="M -8,22 C -18,12 -12,-6 0,-14 C 12,-6 18,12 8,22 Z" fill="#34d399" opacity="0.9" />
    <line x1="0" y1="22" x2="0" y2="-6" stroke="#064e3b" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right: Arabic Name & Registration -->
  <g transform="translate(870, 28)" text-anchor="end">
    <text x="0" y="26" fill="#ffffff" font-family="'Cairo', Arial, sans-serif" font-size="23" font-weight="900">شركة جرين لاين للأسمدة الزراعية</text>
    <text x="0" y="47" fill="#a7f3d0" font-family="'Cairo', Arial, sans-serif" font-size="13" font-weight="700">المتجر الرسمي للأسمدة والمخصبات ومحسنات التربة</text>
    <text x="0" y="66" fill="#ecfdf5" font-family="'Cairo', Arial, sans-serif" font-size="11">معتمد ومطابق للمواصفات القياسية الزراعية</text>
  </g>
</svg>
